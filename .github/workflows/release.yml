name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64

          - os: windows-latest
            name: windows-x64

          - os: macos-latest
            name: macos-arm64

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y ninja-build clang zip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install ninja llvm zip -y

      # ------------------------------------------------------------
      # vcpkg
      # ------------------------------------------------------------

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      # ------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $llvm = "C:\Program Files\LLVM\bin"

          if (-not (Test-Path "$llvm\clang-cl.exe")) {
            Write-Error "clang-cl.exe was not found at $llvm"
            exit 1
          }

          cmake -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$llvm\clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$llvm\clang-cl.exe" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------
      # Package Windows
      # ------------------------------------------------------------

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          # Find executable
          $exe = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "ElvUI-Updater.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "ElvUI-Updater.exe was not found"
            exit 1
          }

          Write-Host "Found executable:"
          Write-Host $exe.FullName

          Copy-Item $exe.FullName package\

          # --------------------------------------------------------
          # Copy vcpkg runtime DLLs
          # --------------------------------------------------------

          $binDir = Join-Path $env:GITHUB_WORKSPACE `
            "vcpkg_installed\x64-windows-static\bin"

          Write-Host "Checking vcpkg bin directory:"
          Write-Host $binDir

          if (Test-Path $binDir) {
            $dlls = Get-ChildItem $binDir -Filter "*.dll"

            if ($dlls.Count -gt 0) {
              Write-Host "Copying vcpkg DLLs:"
              $dlls | ForEach-Object {
                Write-Host $_.Name
                Copy-Item $_.FullName package\
              }
            }
            else {
              Write-Host "No vcpkg DLLs found."
            }
          }
          else {
            Write-Host "vcpkg bin directory does not exist."
          }

          # --------------------------------------------------------
          # Copy any DLLs produced/downloaded by the project
          # --------------------------------------------------------

          $buildDlls = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue

          if ($buildDlls) {
            Write-Host "Copying DLLs from build directory:"

            $buildDlls | ForEach-Object {
              Write-Host $_.FullName
              Copy-Item $_.FullName package\ -Force
            }
          }

          # --------------------------------------------------------
          # README / LICENSE
          # --------------------------------------------------------

          if (Test-Path README.md) {
            Copy-Item README.md package\
          }

          if (Test-Path LICENSE.txt) {
            Copy-Item LICENSE.txt package\
          }

          # --------------------------------------------------------
          # Show package
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Package contents:"
          Get-ChildItem package

          # --------------------------------------------------------
          # Create archive
          # --------------------------------------------------------

          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "ElvUI-Updater-${{ github.ref_name }}-${{ matrix.name }}.zip" `
            -Force

      # ------------------------------------------------------------
      # Package Linux/macOS
      # ------------------------------------------------------------

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package

          find build \
            -type f \
            -name "ElvUI-Updater*" \
            -exec cp {} package/ \;

          if [ -f README.md ]; then
            cp README.md package/
          fi

          if [ -f LICENSE.txt ]; then
            cp LICENSE.txt package/
          fi

          echo "Package contents:"
          ls -la package

          cd package

          zip -r \
            "../ElvUI-Updater-${{ github.ref_name }}-${{ matrix.name }}.zip" \
            .

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElvUI-Updater-${{ github.ref_name }}-${{ matrix.name }}
          path: ElvUI-Updater-${{ github.ref_name }}-${{ matrix.name }}.zip

  # ================================================================
  # GitHub Release
  # ================================================================

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip