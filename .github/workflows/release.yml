name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Dependencies
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y ninja-build clang zip
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja zip -y
      # vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
      # Configure
      - name: Configure (macOS LLVM)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
      # Build
      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release
      # Package
      - name: Package
        shell: bash
        run: |
          mkdir package
          find build -name "ElvUI-Updater*" -exec cp {} package/ \;
          if [ -f README.md ]; then
            cp README.md package/
          fi
          if [ -f LICENSE.txt ]; then
            cp LICENSE.txt package/
          fi
          cd package
          zip -r ../ElvUI-Updater-${{ github.ref_name }}-${{ matrix.name }}.zip .
      # Upload build output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElvUI-Updater-${{ github.ref_name }}-${{ matrix.name }}
          path: ElvUI-Updater-${{ github.ref_name }}-${{ matrix.name }}.zip
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
