name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y ninja-build clang


      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm


      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y


      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11


      - name: Configure (macOS LLVM)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"


      - name: Configure (Linux/Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"


      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release


      - name: Package
        shell: bash
        run: |
          mkdir package

          find build -name "ElvUI-Updater*" -exec cp {} package/ \;

          cp README.md package/
          cp LICENSE.txt package/

          cd package
          zip -r ../ElvUI-Updater-${{ runner.os }}.zip .


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElvUI-Updater-${{ runner.os }}
          path: ElvUI-Updater-${{ runner.os }}.zip


  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip